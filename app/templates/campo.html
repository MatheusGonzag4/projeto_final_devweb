{% if campo.field.widget.input_type == 'checkbox' %}
    <div class="campo campo-check">
        <label for="{{ campo.id_for_label }}">{{ campo }} {{ campo.label }}</label>
        {% for erro in campo.errors %}<p class="erro">{{ erro }}</p>{% endfor %}
    </div>
{% else %}
    <div class="campo">
        <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% if campo.help_text %}<div class="ajuda">{{ campo.help_text|safe }}</div>{% endif %}
        {% for erro in campo.errors %}<p class="erro">{{ erro }}</p>{% endfor %}
    </div>
{% endif %}
